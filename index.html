        <img src="images/aboutText.gif" alt="I am a Computer Science graduate from California State University, San Bernardino, working at the intersection of artificial intelligence, cybersecurity, and social impact. I am passionate about building technology that serves communities. I built FontanaAware, a civic information platform designed to make local resources and information more accessible. This initiative has since expanded into IE Aware, with the goal of providing affordable, transparent, and replicable civic technology for communities throughout the Inland Empire. As a research intern with the ACTION NSF AI Institute at UC Santa Barbara, I developed RedactBench, an automated framework for evaluating LLM-based redactions. I also hold the GIAC Security Essentials Certification (GSEC) and have ranked among the National Cyber League (NCL) Top 100. As an undergrad, I served in student government, supported STEM outreach and mentorship, and contributed to initiatives focused on education, accessibility, and community development. These experiences shaped my belief that technology should not only advance innovation but also create opportunities for those who are often overlooked. Driven by purpose and resilience, I am committed to empowering underrepresented students in STEM, supporting underserved communities, and demonstrating that exceptional talent can emerge from public universities and places where opportunities have historically been limited. I don&#x27;t measure success by titles or recognition, but by the people and communities my work can positively impact." style="display:block;margin:0 auto;width:800px;height:auto;max-width:100%;">
